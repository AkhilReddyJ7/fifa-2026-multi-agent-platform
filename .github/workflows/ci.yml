name: CI

on:
  push:
    branches: [main, phase-3b]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install aiosqlite ruff mypy

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app tests

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app --ignore-missing-imports --no-strict-optional
        continue-on-error: true   # advisory until Phase 2

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: redis://localhost:6379/0
          CHROMA_HOST: localhost
          CHROMA_PORT: 8001
          SECRET_KEY: test-secret-key
          APP_ENV: development
        run: pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: fifa2026-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
