version: "3.9"
# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  api:
    restart: always
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers 4
        --proxy-headers
        --forwarded-allow-ips="*"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
