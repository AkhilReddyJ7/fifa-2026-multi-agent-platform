worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream api {
        server api:8000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Docker's embedded DNS; resolving "frontend" at request time (via the
        # variable below) lets nginx start and keep serving /api even when the
        # frontend container is down.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Streaming chat needs unbuffered proxying, or SSE chunks stall
        location /api/v1/chat/stream {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /metrics {
            deny all;
        }

        location / {
            set $frontend_upstream frontend;
            proxy_pass http://$frontend_upstream:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
